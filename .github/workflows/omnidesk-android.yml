name: Build OmniDesk Android APK

on:
  push:
    branches: [main]
    paths:
      - "omnidesk/android/**"
      - "omnidesk/index.html"
      - "omnidesk/app.js"
      - "omnidesk/style.css"
      - "omnidesk/icon.svg"
      - ".github/workflows/omnidesk-android.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Copy offline app assets
        run: |
          mkdir -p omnidesk/android/app/src/main/assets
          cp omnidesk/index.html omnidesk/android/app/src/main/assets/
          cp omnidesk/app.js omnidesk/android/app/src/main/assets/
          cp omnidesk/style.css omnidesk/android/app/src/main/assets/
          cp omnidesk/icon.svg omnidesk/android/app/src/main/assets/
          sed -i 's@<link rel="manifest" href="manifest.webmanifest">@@' omnidesk/android/app/src/main/assets/index.html
          sed -i 's@<script src="app.js" defer></script>@<script src="app.js" defer></script>@' omnidesk/android/app/src/main/assets/index.html
      - name: Build installable Android APK
        working-directory: omnidesk/android
        run: |
          gradle --version || true
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon
      - name: Publish Android app
        uses: actions/upload-artifact@v4
        with:
          name: OmniDesk-Android-APK
          path: omnidesk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
